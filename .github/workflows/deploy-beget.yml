name: Deploy Frontend To Beget

on:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-beget.yml"
      - ".github/scripts/deploy_frontend_remote.sh"
  workflow_dispatch:

concurrency:
  group: deploy-beget-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
      DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      YANDEX_WEBMASTER_HOST_URL: ${{ secrets.YANDEX_WEBMASTER_HOST_URL }}
      YANDEX_WEBMASTER_FEED_URL: ${{ secrets.YANDEX_WEBMASTER_FEED_URL }}
      YANDEX_WEBMASTER_FEED_TYPE: ${{ secrets.YANDEX_WEBMASTER_FEED_TYPE }}
      YANDEX_WEBMASTER_FEED_REGION_IDS: ${{ secrets.YANDEX_WEBMASTER_FEED_REGION_IDS }}
      YANDEX_WEBMASTER_TIMEOUT_MS: ${{ secrets.YANDEX_WEBMASTER_TIMEOUT_MS }}
      YANDEX_WEBMASTER_OAUTH_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
      YANDEX_WEBMASTER_CLIENT_ID: ${{ secrets.YANDEX_WEBMASTER_CLIENT_ID }}
      YANDEX_WEBMASTER_CLIENT_SECRET: ${{ secrets.YANDEX_WEBMASTER_CLIENT_SECRET }}
      YANDEX_WEBMASTER_REFRESH_TOKEN: ${{ secrets.YANDEX_WEBMASTER_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "DEPLOY_HOST is missing"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "DEPLOY_USER is missing"; exit 1; }
          test -n "${DEPLOY_APP_DIR}" || { echo "DEPLOY_APP_DIR is missing"; exit 1; }
          test -n "${DEPLOY_SERVICE_NAME}" || { echo "DEPLOY_SERVICE_NAME is missing"; exit 1; }
          KEY_PRESENT="${{ secrets.SSH_PRIVATE_KEY != '' }}"
          PASSWORD_PRESENT="${{ secrets.DEPLOY_PASSWORD != '' }}"
          echo "KEY_PRESENT=${KEY_PRESENT}" >> "$GITHUB_ENV"
          echo "PASSWORD_PRESENT=${PASSWORD_PRESENT}" >> "$GITHUB_ENV"
          if [[ "${KEY_PRESENT}" != "true" && "${PASSWORD_PRESENT}" != "true" ]]; then
            echo "Either SSH_PRIVATE_KEY or DEPLOY_PASSWORD must be set"
            exit 1
          fi
          if [[ "${KEY_PRESENT}" == "true" ]]; then
            echo "AUTH_MODE=key" >> "$GITHUB_ENV"
          else
            echo "AUTH_MODE=password" >> "$GITHUB_ENV"
          fi

      - name: Install frontend dependencies and run build check
        run: |
          set -euo pipefail
          npm --prefix ./frontend ci
          npm --prefix ./frontend run build

      - name: Prepare SSH known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare SSH private key (optional)
        run: |
          set -euo pipefail
          if [[ "${KEY_PRESENT:-false}" != "true" ]]; then
            echo "SSH_PRIVATE_KEY is not set; skipping key setup"
            exit 0
          fi
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          if ! grep -Eq '^-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----$' ~/.ssh/id_rsa; then
            echo "SSH_PRIVATE_KEY is not a private key"
            if [[ "${PASSWORD_PRESENT:-false}" == "true" ]]; then
              echo "AUTH_MODE=password" >> "$GITHUB_ENV"
              rm -f ~/.ssh/id_rsa
              echo "Falling back to password mode"
              exit 0
            fi
            echo "SSH_PRIVATE_KEY must contain a PRIVATE key, not a public ssh-rsa line"
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1; then
            echo "SSH_PRIVATE_KEY is invalid (malformed, encrypted with passphrase, or not supported)"
            if [[ "${PASSWORD_PRESENT:-false}" == "true" ]]; then
              echo "AUTH_MODE=password" >> "$GITHUB_ENV"
              rm -f ~/.ssh/id_rsa
              echo "Falling back to password mode"
              exit 0
            fi
            exit 1
          fi
          chmod 600 ~/.ssh/id_rsa
          echo "AUTH_MODE=key" >> "$GITHUB_ENV"

      - name: Install sshpass for password auth (optional)
        run: |
          set -euo pipefail
          if [[ "${AUTH_MODE:-key}" != "password" ]]; then
            echo "Auth mode is '${AUTH_MODE:-key}'; sshpass is not required"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Verify SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          echo "Using auth mode: ${AUTH_MODE:-key}"
          if [[ "${AUTH_MODE:-key}" == "key" ]]; then
            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o ConnectTimeout=20 \
              -i ~/.ssh/id_rsa \
              -p "${PORT}" \
              "${TARGET}" \
              "echo ssh-auth-ok"
          else
            SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o ConnectTimeout=20 \
              -p "${PORT}" \
              "${TARGET}" \
              "echo ssh-auth-ok"
          fi

      - name: Build deploy archive
        run: |
          set -euo pipefail
          tar -czf frontend-${{ github.sha }}.tgz \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.next' \
            --exclude='frontend/.env.local' \
            -C . frontend

      - name: Upload archive and remote script
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          if [[ "${AUTH_MODE:-key}" == "key" ]]; then
            scp \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o ConnectTimeout=20 \
              -i ~/.ssh/id_rsa \
              -P "${PORT}" \
              frontend-${{ github.sha }}.tgz "${TARGET}:/tmp/frontend-${{ github.sha }}.tgz"
            scp \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o ConnectTimeout=20 \
              -i ~/.ssh/id_rsa \
              -P "${PORT}" \
              ./.github/scripts/deploy_frontend_remote.sh "${TARGET}:/tmp/deploy_frontend_remote.sh"
          else
            SSHPASS="${DEPLOY_PASSWORD}" sshpass -e scp \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o ConnectTimeout=20 \
              -P "${PORT}" \
              frontend-${{ github.sha }}.tgz "${TARGET}:/tmp/frontend-${{ github.sha }}.tgz"
            SSHPASS="${DEPLOY_PASSWORD}" sshpass -e scp \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o ConnectTimeout=20 \
              -P "${PORT}" \
              ./.github/scripts/deploy_frontend_remote.sh "${TARGET}:/tmp/deploy_frontend_remote.sh"
          fi

      - name: Run remote deploy
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          FRONTEND_ENV_LOCAL_PLAIN: ${{ secrets.FRONTEND_ENV_LOCAL }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          FRONTEND_ENV_LOCAL_B64_RUNTIME='${{ secrets.FRONTEND_ENV_LOCAL_B64 }}'
          if [[ -n "${FRONTEND_ENV_LOCAL_PLAIN:-}" ]]; then
            FRONTEND_ENV_LOCAL_B64_RUNTIME="$(printf '%s' "${FRONTEND_ENV_LOCAL_PLAIN}" | base64 | tr -d '\n')"
          fi
          if [[ "${AUTH_MODE:-key}" == "key" ]]; then
            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o ConnectTimeout=20 \
              -i ~/.ssh/id_rsa \
              -p "${PORT}" \
              "${TARGET}" \
              "chmod +x /tmp/deploy_frontend_remote.sh && \
               DEPLOY_ARCHIVE_PATH=/tmp/frontend-${{ github.sha }}.tgz \
               DEPLOY_APP_DIR='${DEPLOY_APP_DIR}' \
               DEPLOY_SERVICE_NAME='${DEPLOY_SERVICE_NAME}' \
               DEPLOY_LABEL='${{ github.sha }}' \
               FRONTEND_ENV_LOCAL_B64='${FRONTEND_ENV_LOCAL_B64_RUNTIME}' \
              NEXT_PUBLIC_SITE_URL='${{ secrets.NEXT_PUBLIC_SITE_URL }}' \
              YANDEX_WEBMASTER_HOST_URL='${{ secrets.YANDEX_WEBMASTER_HOST_URL }}' \
              YANDEX_WEBMASTER_FEED_URL='${{ secrets.YANDEX_WEBMASTER_FEED_URL }}' \
              YANDEX_WEBMASTER_FEED_TYPE='${{ secrets.YANDEX_WEBMASTER_FEED_TYPE }}' \
              YANDEX_WEBMASTER_FEED_REGION_IDS='${{ secrets.YANDEX_WEBMASTER_FEED_REGION_IDS }}' \
              YANDEX_WEBMASTER_TIMEOUT_MS='${{ secrets.YANDEX_WEBMASTER_TIMEOUT_MS }}' \
              YANDEX_WEBMASTER_OAUTH_TOKEN='${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}' \
              YANDEX_WEBMASTER_CLIENT_ID='${{ secrets.YANDEX_WEBMASTER_CLIENT_ID }}' \
              YANDEX_WEBMASTER_CLIENT_SECRET='${{ secrets.YANDEX_WEBMASTER_CLIENT_SECRET }}' \
              YANDEX_WEBMASTER_REFRESH_TOKEN='${{ secrets.YANDEX_WEBMASTER_REFRESH_TOKEN }}' \
               /tmp/deploy_frontend_remote.sh"
          else
            SSHPASS="${DEPLOY_PASSWORD}" sshpass -e ssh \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o ConnectTimeout=20 \
              -p "${PORT}" \
              "${TARGET}" \
              "chmod +x /tmp/deploy_frontend_remote.sh && \
               DEPLOY_ARCHIVE_PATH=/tmp/frontend-${{ github.sha }}.tgz \
               DEPLOY_APP_DIR='${DEPLOY_APP_DIR}' \
               DEPLOY_SERVICE_NAME='${DEPLOY_SERVICE_NAME}' \
               DEPLOY_LABEL='${{ github.sha }}' \
               FRONTEND_ENV_LOCAL_B64='${FRONTEND_ENV_LOCAL_B64_RUNTIME}' \
                NEXT_PUBLIC_SITE_URL='${{ secrets.NEXT_PUBLIC_SITE_URL }}' \
                YANDEX_WEBMASTER_HOST_URL='${{ secrets.YANDEX_WEBMASTER_HOST_URL }}' \
                YANDEX_WEBMASTER_FEED_URL='${{ secrets.YANDEX_WEBMASTER_FEED_URL }}' \
                YANDEX_WEBMASTER_FEED_TYPE='${{ secrets.YANDEX_WEBMASTER_FEED_TYPE }}' \
                YANDEX_WEBMASTER_FEED_REGION_IDS='${{ secrets.YANDEX_WEBMASTER_FEED_REGION_IDS }}' \
                YANDEX_WEBMASTER_TIMEOUT_MS='${{ secrets.YANDEX_WEBMASTER_TIMEOUT_MS }}' \
                YANDEX_WEBMASTER_OAUTH_TOKEN='${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}' \
                YANDEX_WEBMASTER_CLIENT_ID='${{ secrets.YANDEX_WEBMASTER_CLIENT_ID }}' \
                YANDEX_WEBMASTER_CLIENT_SECRET='${{ secrets.YANDEX_WEBMASTER_CLIENT_SECRET }}' \
                YANDEX_WEBMASTER_REFRESH_TOKEN='${{ secrets.YANDEX_WEBMASTER_REFRESH_TOKEN }}' \
               /tmp/deploy_frontend_remote.sh"
          fi
