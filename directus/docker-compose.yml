name: katet-directus

services:
  postgres:
    image: postgres:16-alpine
    container_name: katet-directus-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katet_directus}
      POSTGRES_USER: ${POSTGRES_USER:-katet_directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katet_directus_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11
    container_name: katet-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-katet-local-directus-key}
      SECRET: ${DIRECTUS_SECRET:-katet-local-directus-secret}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-katet_directus}
      DB_USER: ${POSTGRES_USER:-katet_directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-katet_directus_password}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-katet_directus_admin}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${DIRECTUS_CORS_ORIGIN:-http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000,http://127.0.0.1:8081}
      TELEMETRY: "false"
    volumes:
      - uploads:/directus/uploads
      - extensions:/directus/extensions

volumes:
  postgres-data:
  uploads:
  extensions: