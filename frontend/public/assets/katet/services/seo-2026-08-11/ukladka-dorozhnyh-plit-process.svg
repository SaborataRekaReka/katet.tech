<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Этапы укладки дорожных плит</title><desc id="desc">Трасса, основание, уплотнение, монтаж и проверка</desc><rect width="1200" height="420" rx="36" fill="#f7f5ff"/><path d="M0 315h1200v105H0z" fill="#dddde2"/><g font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="72" font-size="34" font-weight="700" fill="#241b45">Укладка дорожных плит: рабочая схема</text><g font-size="18" font-weight="600" fill="#241b45"><g transform="translate(54 132)"><rect width="190" height="136" rx="24" fill="#fff" stroke="#ded7f7"/><circle cx="95" cy="44" r="24" fill="#f6bd2f"/><text x="95" y="51">1</text><text x="95" y="92">Разметка</text><text x="95" y="118" font-size="15" font-weight="400">трассы дороги</text></g><g transform="translate(280 132)"><rect width="190" height="136" rx="24" fill="#fff" stroke="#ded7f7"/><circle cx="95" cy="44" r="24" fill="#f6bd2f"/><text x="95" y="51">2</text><text x="95" y="92">Основание</text><text x="95" y="118" font-size="15" font-weight="400">песок и щебень</text></g><g transform="translate(506 132)"><rect width="190" height="136" rx="24" fill="#fff" stroke="#ded7f7"/><circle cx="95" cy="44" r="24" fill="#f6bd2f"/><text x="95" y="51">3</text><text x="95" y="92">Уплотнение</text><text x="95" y="118" font-size="15" font-weight="400">и отметки</text></g><g transform="translate(732 132)"><rect width="190" height="136" rx="24" fill="#fff" stroke="#ded7f7"/><circle cx="95" cy="44" r="24" fill="#f6bd2f"/><text x="95" y="51">4</text><text x="95" y="92">Монтаж плит</text><text x="95" y="118" font-size="15" font-weight="400">краном</text></g><g transform="translate(958 132)"><rect width="190" height="136" rx="24" fill="#fff" stroke="#ded7f7"/><circle cx="95" cy="44" r="24" fill="#f6bd2f"/><text x="95" y="51">5</text><text x="95" y="92">Проверка</text><text x="95" y="118" font-size="15" font-weight="400">п